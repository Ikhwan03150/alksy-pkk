<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Penilaian Karyawan - Al Syukro Universal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary:   { DEFAULT: '#036F3E', light: '#04914F', dark: '#024D2B' },
                        secondary: { DEFAULT: '#529837', light: '#6AB84A', dark: '#3B7027' },
                        accent:    { DEFAULT: '#F77604', light: '#FF9235', dark: '#D45F00' },
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="app">
        <!-- Notifikasi Toast -->
        <div id="toast-container"></div>

        <!-- Layar Login -->
        <div id="login-screen" class="screen active">
            <div class="login-wrapper">
                <div class="login-glass">
                    <div class="login-header">
                        <div class="logo-circle">
                            <i class="fas fa-graduation-cap"></i>
                        </div>
                        <h2>Al Syukro Universal</h2>
                        <p>Sistem Penilaian Kinerja Karyawan</p>
                    </div>
                    <form id="login-form">
                        <div class="input-group">
                            <i class="fas fa-id-badge"></i>
                            <input type="text" id="login-nip" placeholder="NIP Karyawan" required>
                        </div>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="login-password" placeholder="Password" required>
                            <button type="button" class="btn-toggle-password" data-target="login-password" title="Tampilkan/Sembunyikan Password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <button type="submit" class="btn-primary" id="btn-login">
                            <span>Masuk</span>
                            <i class="fas fa-arrow-right"></i>
                        </button>
                    </form>
                </div>
                <div class="login-decoration"></div>
            </div>
        </div>

        <!-- Layar Utama Aplikasi -->
        <div id="main-screen" class="screen">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <div class="logo-circle small">
                        <i class="fas fa-graduation-cap"></i>
                    </div>
                    <h3>Al Syukro PKK</h3>
                </div>
                <div class="user-profile-mini">
                    <div class="avatar"><i class="fas fa-user"></i></div>
                    <div class="user-info">
                        <h4 id="sidebar-user-name">Nama User</h4>
                        <span id="sidebar-user-role">Role</span>
                    </div>
                </div>
                <nav class="sidebar-nav" id="sidebar-menu">
                    <!-- Menu dinamis di-render via JS -->
                </nav>
                <div class="sidebar-footer">
                    <a href="#" id="menu-logout" class="nav-item text-danger">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>Keluar</span>
                    </a>
                </div>
            </aside>

            <!-- Konten Utama -->
            <main class="main-content">
                <header class="topbar">
                    <div class="topbar-left">
                        <button id="btn-toggle-sidebar" class="btn-icon"><i class="fas fa-bars"></i></button>
                        <h2 id="page-title">Dasbor</h2>
                    </div>
                    <div class="topbar-right">
                        <div class="academic-year-badge">
                            <i class="fas fa-calendar-alt"></i>
                            <span id="active-academic-year">TA. 2024/2025</span>
                        </div>
                        <button id="btn-user-profile" class="user-avatar-btn" title="Profil User">
                            <i class="fas fa-user-circle"></i>
                            <span id="user-avatar-initials" class="user-avatar-initials"></span>
                        </button>
                    </div>
                </header>

                <div class="content-area" id="content-area">
                    <!-- Halaman dinamis di-render via JS -->
                </div>
            </main>

            <!-- Bottom Navigation Bar untuk Mobile (HP) -->
            <nav class="mobile-bottom-nav" id="mobile-bottom-menu">
                <!-- Menu dinamis di-render via JS -->
            </nav>
        </div>
    </div>

    <!-- Modal Profile & Logout Mobile -->
    <div id="modal-user-profile" class="modal-backdrop" style="display:none;">
        <div class="user-profile-modal-card">
            <div class="user-profile-modal-header">
                <div class="avatar large"><i class="fas fa-user"></i></div>
                <h3 id="mobile-profile-name">Nama User</h3>
                <span id="mobile-profile-role" class="badge-role">Role</span>
                <button id="btn-close-profile-modal" class="modal-close-btn">&times;</button>
            </div>
            <div class="user-profile-modal-body">
                <div class="profile-info-row">
                    <span class="info-label"><i class="fas fa-id-badge"></i> NIP</span>
                    <span class="info-val" id="mobile-profile-nip">-</span>
                </div>
                <div class="profile-info-row">
                    <span class="info-label"><i class="fas fa-building"></i> Unit</span>
                    <span class="info-val" id="mobile-profile-unit">-</span>
                </div>
                <div class="profile-info-row">
                    <span class="info-label"><i class="fas fa-briefcase"></i> Jabatan</span>
                    <span class="info-val" id="mobile-profile-jabatan">-</span>
                </div>
            </div>
            <div class="user-profile-modal-footer">
                <button id="btn-mobile-logout" class="btn-logout-mobile">
                    <i class="fas fa-sign-out-alt"></i> Keluar (Logout)
                </button>
            </div>
        </div>
    </div>

    <!-- Template Halaman (Disembunyikan) -->
    <template id="tpl-dashboard">
        <div class="page page-dashboard fade-in">
            <!-- Profile Card (untuk non-management, diisi via JS) -->
            <div id="dashboard-profile-card"></div>

            <!-- 4 Stat Cards (manajemen saja) -->
            <div class="stats-grid" id="dashboard-stats" style="grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px;">
                <!-- Statistik dirender via JS -->
            </div>

            <!-- Card Grafik & Ranking 10 Karyawan Terbaik (manajemen saja) -->
            <div id="dashboard-chart-section" class="card glass-card" style="margin-bottom:24px;">
                <div class="card-header flex-between" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
                    <div>
                        <h3 class="gradient-text"><i class="fas fa-trophy" style="color:#eab308;"></i> 10 Karyawan Terbaik (Top Performance)</h3>
                        <p class="text-muted" style="margin:4px 0 0; font-size:0.85rem;">Peringkat karyawan dengan nilai tertinggi berdasarkan unit dan level.</p>
                    </div>
                    <div style="display:flex; gap:10px; flex-wrap:wrap;">
                        <select id="chart-filter-unit" class="form-control" style="min-width:140px; font-size:0.85rem;">
                            <option value="">-- Semua Unit --</option>
                        </select>
                        <select id="chart-filter-level" class="form-control" style="min-width:140px; font-size:0.85rem;">
                            <option value="">-- Semua Level --</option>
                        </select>
                    </div>
                </div>
                <div class="card-body">
                    <div id="chart-container-wrapper" style="position:relative; height:320px; width:100%; margin-bottom:24px;">
                        <canvas id="top-employees-chart"></canvas>
                    </div>
                    <div id="top-employees-list">
                        <!-- Table Leaderboard dirender via JS -->
                    </div>
                </div>
            </div>

            <!-- Pengumuman Terbaru -->
            <div class="dashboard-grid" style="grid-template-columns: 1fr;">
                <div class="card card-announcements">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h3><i class="fas fa-bullhorn text-primary"></i> Pengumuman Terbaru</h3>
                        <button class="btn-primary" id="btn-tambah-pengumuman"
                            style="display:none; padding: 6px 12px; font-size: 0.85rem;"><i class="fas fa-plus"></i>
                            Tambah</button>
                    </div>
                    <div class="card-body list-announcements" id="dashboard-announcements">
                        <!-- Pengumuman dirender via JS -->
                    </div>
                </div>
            </div>

            <!-- Modal Pengumuman -->
            <div id="modal-pengumuman"
                style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; justify-content:center; align-items:center;">
                <div class="card glass-card" style="width: 500px; padding: 20px;">
                    <h4 class="mb-3" id="modal-pengumuman-title">Tambah Pengumuman</h4>
                    <input type="hidden" id="input-pengumuman-id">
                    <input type="text" id="input-pengumuman-judul" class="form-control mb-2"
                        placeholder="Judul Pengumuman">
                    <textarea id="input-pengumuman-deskripsi" class="form-control mb-3" placeholder="Isi pengumuman..."
                        rows="4"></textarea>
                    <div class="text-right">
                        <button class="btn-secondary" id="btn-batal-pengumuman"
                            style="margin-right:10px;">Batal</button>
                        <button class="btn-primary" id="btn-simpan-pengumuman">Simpan</button>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template id="tpl-form_ski">
        <div class="page page-form-ski fade-in">
            <div class="card glass-card">
                <!-- Header -->
                <div class="card-header">
                    <div>
                        <h3 class="gradient-text"><i class="fas fa-table"></i> Buat Template SKI Jabatan</h3>
                        <p class="text-muted" style="margin:4px 0 0; font-size:0.85rem;">Akumulasi bobot baris SKI harus
                            bernilai tepat 100%.</p>
                    </div>
                </div>

                <div class="card-body">
                    <!-- Filter: Target Unit + Target Level Jabatan + Target Jabatan -->
                    <div
                        style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:16px; margin-bottom:20px;">
                        <div class="form-group">
                            <label style="font-size:0.85rem; color:#64748b; font-weight:600;">Target Unit</label>
                            <select id="ski-sel-unit" class="form-control mt-1">
                                <!-- Diisi via JS otomatis dari unit user -->
                            </select>
                        </div>
                        <div class="form-group">
                            <label style="font-size:0.85rem; color:#64748b; font-weight:600;">Target Level
                                Jabatan</label>
                            <select id="ski-sel-level" class="form-control mt-1">
                                <option value="">-- Pilih Level --</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label style="font-size:0.85rem; color:#64748b; font-weight:600;">Target Jabatan</label>
                            <select id="ski-sel-jabatan" class="form-control mt-1">
                                <option value="">-- Pilih Jabatan --</option>
                            </select>
                        </div>
                    </div>

                    <!-- Container Card SKI Dinamis -->
                    <div id="tbody-ski-rows" style="margin-bottom:16px;">
                        <!-- Cards diisi via JS -->
                    </div>

                    <!-- Total Bobot Summary Banner -->
                    <div style="background:#f8fafc; border:1.5px solid #cbd5e1; border-radius:12px; padding:14px 20px; display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                        <div style="font-weight:700; color:#334155; font-size:0.95rem;">
                            <i class="fas fa-calculator" style="color:#059669; margin-right:6px;"></i> AKUMULASI TOTAL BOBOT :
                        </div>
                        <div id="ski-total-bobot" style="font-weight:800; font-size:1.3rem; color:#ef4444;">
                            0%
                        </div>
                    </div>

                    <!-- Footer Actions -->
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:16px;">
                        <button class="btn-secondary" id="btn-tambah-baris-ski" style="padding:10px 20px; font-weight:600;"><i class="fas fa-plus"></i> Tambah Baris SKI</button>
                        <button class="btn-primary" id="btn-simpan-template-ski" style="background:#059669; padding:10px 24px; font-weight:600;"><i class="fas fa-save"></i> Simpan Template SKI</button>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template id="tpl-daftar_ski">
        <div class="page page-daftar-ski fade-in">
            <div class="card glass-card">
                <div class="card-header d-flex justify-content-between align-items-center"
                    style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
                    <div>
                        <h3 class="gradient-text"><i class="fas fa-list-alt"></i> SKI Jabatan</h3>
                        <p class="text-muted" style="margin:4px 0 0; font-size:0.85rem;">Daftar seluruh Sasaran Kerja
                            Individu (SKI) yang telah dibuat dalam sistem.</p>
                    </div>
                    <div style="display:flex; gap:8px; align-items:center;">
                        <button class="btn-secondary" id="btn-refresh-ski" style="font-size:0.85rem; padding:8px 14px;" title="Segarkan Data dari Cloud">
                            <i class="fas fa-sync-alt"></i> Refresh
                        </button>
                        <button class="btn-primary" id="btn-input-ski-baru" style="font-size:0.85rem; padding:8px 16px;">
                            <i class="fas fa-plus"></i> Input SKI Baru
                        </button>
                    </div>
                </div>
                <div class="card-body">
                    <!-- Table -->
                    <div class="table-responsive">
                        <table class="table table-bordered table-hover" id="table-daftar-ski"
                            style="font-size:0.85rem; min-width:700px;">
                            <thead style="background:#1e293b; color:white;">
                                <tr>
                                    <th style="width:50px; text-align:center; background:#1e293b; color:white;">NO</th>
                                    <th style="width:140px; background:#1e293b; color:white;">TARGET UNIT</th>
                                    <th style="width:140px; background:#1e293b; color:white;">LEVEL JABATAN</th>
                                    <th style="min-width:200px; background:#1e293b; color:white;">TARGET JABATAN</th>
                                    <th style="width:120px; text-align:center; background:#1e293b; color:white;">TARGET
                                    </th>
                                    <th style="width:140px; text-align:center; background:#1e293b; color:white;">AKSI
                                    </th>
                                </tr>
                            </thead>
                            <tbody id="tbody-daftar-ski">
                                <tr>
                                    <td colspan="6" class="text-center" style="padding:30px;"><i
                                            class="fas fa-spinner fa-spin"></i> Memuat data SKI dari database...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal Detail Skala Penilaian -->
        <div id="modal-detail-ski"
            style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; justify-content:center; align-items:center; padding:15px;">
            <div class="card glass-card"
                style="width: 100%; max-width:650px; padding: 24px; max-height:90vh; overflow-y:auto;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                    <h4 id="modal-ski-title" style="margin:0; color:#1e293b;"><i
                            class="fas fa-info-circle text-primary"></i> Detail Kriteria SKI</h4>
                    <button id="btn-close-modal-ski"
                        style="background:none; border:none; font-size:1.2rem; cursor:pointer; color:#64748b;"><i
                            class="fas fa-times"></i></button>
                </div>
                <div id="modal-ski-body">
                    <!-- Dynamic details -->
                </div>
            </div>
        </div>
    </template>

    <template id="tpl-evaluasi">
        <div class="page page-evaluasi fade-in">
            <div class="card glass-card">
                <div class="card-header flex-between">
                    <div>
                        <h3 class="gradient-text">Formulir Evaluasi Mandiri (PKK)</h3>
                        <p class="text-muted">Isi penilaian mandiri berdasarkan kinerja Anda di periode ini.</p>
                    </div>
                    <div class="status-badge" id="form-pkk-status">Draft</div>
                </div>
                <div class="card-body">
                    <form id="form-pkk">
                        <!-- Card Detail Karyawan (Tampil Saat Review/Verifikasi Atasan) -->
                        <div id="review-employee-detail-card" style="display:none; margin-bottom: 20px;"></div>

                        <!-- Bagian A: SKI / KPI -->
                        <section class="form-section">
                            <h4 class="section-title"><span class="badge">A</span> Penilaian Hasil Kerja (KPI)</h4>
                            <div class="info-box">
                                <i class="fas fa-info-circle"></i> Bobot Aspek Hasil Kerja: <strong
                                    id="bobot-kpi-text">50%</strong>. Skala Nilai: 1 (Sangat Kurang) - 5 (Sangat Baik).
                            </div>
                            <div class="table-responsive">
                                <table class="table" id="table-kpi" style="min-width:900px;">
                                    <thead style="background:#1e293b; color:white;">
                                        <tr>
                                            <th style="width:40px; background:#1e293b; color:white;">No</th>
                                            <th style="background:#1e293b; color:white;">Sasaran Kerja Individu (SKI)
                                            </th>
                                            <th style="width:130px; background:#1e293b; color:white;">Target</th>
                                            <th style="background:#334155; color:#94a3b8; font-size:0.8rem;" colspan="5"
                                                title="Klik tombol info untuk lihat kriteria">Kriteria Penilaian (1–5)
                                            </th>
                                            <th style="width:70px; text-align:center; background:#1e293b; color:white;">
                                                Bobot</th>
                                            <th style="width:90px; text-align:center; background:#1e293b; color:white;">
                                                Nilai</th>
                                            <th style="width:80px; text-align:center; background:#1e293b; color:white;">
                                                B × N</th>
                                        </tr>
                                        <tr>
                                            <th colspan="3" style="background:#1e293b;"></th>
                                            <th
                                                style="text-align:center; background:#334155; color:#94a3b8; font-size:0.75rem; padding:4px;">
                                                Skala 1</th>
                                            <th
                                                style="text-align:center; background:#334155; color:#94a3b8; font-size:0.75rem; padding:4px;">
                                                Skala 2</th>
                                            <th
                                                style="text-align:center; background:#334155; color:#94a3b8; font-size:0.75rem; padding:4px;">
                                                Skala 3</th>
                                            <th
                                                style="text-align:center; background:#334155; color:#94a3b8; font-size:0.75rem; padding:4px;">
                                                Skala 4</th>
                                            <th
                                                style="text-align:center; background:#334155; color:#94a3b8; font-size:0.75rem; padding:4px;">
                                                Skala 5</th>
                                            <th colspan="3" style="background:#1e293b;"></th>
                                        </tr>
                                    </thead>
                                    <tbody id="tbody-kpi">
                                        <!-- Diisi via JS -->
                                    </tbody>
                                    <tfoot>
                                        <tr class="table-total">
                                            <td colspan="9" class="text-right"
                                                style="font-weight:700; color:#334155; padding:10px 16px;">Total Hasil
                                                Kerja (B × N):</td>
                                            <td id="total-kpi-score"
                                                style="text-align:center; font-weight:700; color:#16a34a;">0</td>
                                            <td></td>
                                        </tr>
                                    </tfoot>
                                </table>
                            </div>
                        </section>

                        <!-- Bagian B: Perilaku -->
                        <section class="form-section mt-4">
                            <h4 class="section-title"><span class="badge">B</span> Penilaian Aspek Perilaku</h4>
                            <div class="info-box">
                                <i class="fas fa-info-circle"></i> Bobot Aspek Perilaku: <strong
                                    id="bobot-perilaku-text">30%</strong>. Skala Nilai: 1 (Sangat Kurang) &mdash; 4
                                (Baik Sekali).
                            </div>
                            <div
                                style="display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:12px; margin-top:12px;">
                                <div class="penilaian-item">
                                    <label class="penilaian-label">Kualitas Hasil Kerja</label>
                                    <input type="number" min="1" max="4" class="form-control input-nilai-perilaku"
                                        data-id="p_kualitas_hasil_kerja" placeholder="1 - 4" required>
                                </div>
                                <div class="penilaian-item">
                                    <label class="penilaian-label">Ketepatan Waktu Pengerjaan</label>
                                    <input type="number" min="1" max="4" class="form-control input-nilai-perilaku"
                                        data-id="p_ketepatan_waktu" placeholder="1 - 4" required>
                                </div>
                                <div class="penilaian-item">
                                    <label class="penilaian-label">Keterampilan Kerja</label>
                                    <input type="number" min="1" max="4" class="form-control input-nilai-perilaku"
                                        data-id="p_keterampilan_kerja" placeholder="1 - 4" required>
                                </div>
                                <div class="penilaian-item">
                                    <label class="penilaian-label">Kerjasama</label>
                                    <input type="number" min="1" max="4" class="form-control input-nilai-perilaku"
                                        data-id="p_kerjasama" placeholder="1 - 4" required>
                                </div>
                                <div class="penilaian-item">
                                    <label class="penilaian-label">Disiplin</label>
                                    <input type="number" min="1" max="4" class="form-control input-nilai-perilaku"
                                        data-id="p_disiplin" placeholder="1 - 4" required>
                                </div>
                                <div class="penilaian-item">
                                    <label class="penilaian-label">Inisiatif</label>
                                    <input type="number" min="1" max="4" class="form-control input-nilai-perilaku"
                                        data-id="p_inisiatif" placeholder="1 - 4" required>
                                </div>
                                <div class="penilaian-item">
                                    <label class="penilaian-label">Peningkatan Tanggung Jawab</label>
                                    <input type="number" min="1" max="4" class="form-control input-nilai-perilaku"
                                        data-id="p_peningkatan_tanggung_jawab" placeholder="1 - 4" required>
                                </div>
                                <div class="penilaian-item">
                                    <label class="penilaian-label">Akhlak Islami</label>
                                    <input type="number" min="1" max="4" class="form-control input-nilai-perilaku"
                                        data-id="p_ahlak_islami" placeholder="1 - 4" required>
                                </div>
                                <div class="penilaian-item">
                                    <label class="penilaian-label">Adaptasi Terhadap Perubahan</label>
                                    <input type="number" min="1" max="4" class="form-control input-nilai-perilaku"
                                        data-id="p_adaptasi_terhadap_perubahan" placeholder="1 - 4" required>
                                </div>
                            </div>
                        </section>

                        <!-- Bagian C: Manajerial (Conditional) -->
                        <section class="form-section mt-4" id="section-manajerial" style="display: none;">
                            <h4 class="section-title"><span class="badge">C</span> Penilaian Aspek Manajerial</h4>
                            <div class="info-box">
                                <i class="fas fa-info-circle"></i> Bobot Aspek Manajerial: <strong
                                    id="bobot-manajerial-text">20%</strong>. Skala Nilai: 1 (Sangat Kurang) &mdash; 4
                                (Baik Sekali).
                            </div>
